<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070709;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(168, 85, 247, 0.18), transparent 45%),
                radial-gradient(circle at 85% 40%, rgba(56, 239, 125, 0.06), transparent 40%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- İLK AÇILIŞ (SPLASH) EKRANI & GEZEGEN LOGO --- */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: #070709;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(200, 130, 214, 0.15), transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(56, 239, 125, 0.08), transparent 40%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 16px;
            /* Akıcı yukarı kaydırma geçiş animasyonu */
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
        }

        #splashScreen.slide-up {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .splash-top {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .brand-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: 0.5px;
        }

        .splash-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }

        /* Dönen Gezegen Logo Alanı */
        .splash-globe-container {
            width: 150px;
            height: 150px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-logo-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            z-index: 2;
        }

        .orbit-ring {
            position: absolute;
            inset: 0;
            border: 2px dashed rgba(200, 130, 214, 0.4);
            border-radius: 50%;
            animation: rotateOrbit 10s linear infinite;
            z-index: 1;
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .splash-subtitle {
            font-size: 0.88rem;
            color: #a1a1aa;
            max-width: 280px;
            line-height: 1.4;
        }

        /* Politika Butonları */
        .splash-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 480px;
        }

        .splash-pill {
            background: rgba(24, 24, 30, 0.85);
            border: 1px solid rgba(200, 130, 214, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .splash-pill svg {
            width: 18px;
            height: 18px;
            stroke: #c882d6;
            flex-shrink: 0;
        }

        .splash-pill:hover {
            background: rgba(200, 130, 214, 0.16);
            border-color: rgba(200, 130, 214, 0.5);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .splash-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .more-btn {
            background: linear-gradient(135deg, #9c4dcc, #c882d6);
            border: none;
            color: #09090b;
            padding: 10px 28px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(200, 130, 214, 0.3);
        }

        .more-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .bounce-arrow {
            width: 20px;
            height: 20px;
            stroke: #c882d6;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-2px); }
        }

        /* --- ANA UYGULAMA MAĞAZASI İÇERİĞİ --- */
        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand-logo-text-main {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: 0.5px;
        }

        .mini-emblem {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 10px rgba(56, 239, 125, 0.4));
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(200, 130, 214, 0.25);
            border-radius: 14px;
            padding: 10px 14px;
            gap: 10px;
            backdrop-filter: blur(8px);
        }

        .search-container svg {
            width: 18px;
            height: 18px;
            stroke: #c882d6;
            flex-shrink: 0;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.88rem;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: #71717a;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: -6px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
        }

        .app-count {
            font-size: 0.75rem;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .modern-app-card:hover {
            background: rgba(30, 30, 38, 0.95);
            border-color: rgba(200, 130, 214, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #121212;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .app-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        .tag-free {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.68rem;
        }

        .download-pill {
            background: linear-gradient(135deg, #9c4dcc, #c882d6);
            color: #09090b;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 9px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(200, 130, 214, 0.3);
        }

        .no-result {
            text-align: center;
            color: #71717a;
            font-size: 0.85rem;
            padding: 20px 0;
        }

        /* --- MODAL PENCERE ANİMASYONLARI (FADE & ZOOM) --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            
            /* Başlangıçta gizli ve tıklanamaz */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #111115;
            border: 1px solid #c882d6;
            box-shadow: 0 0 30px rgba(200, 130, 214, 0.3);
            border-radius: 18px;
            max-width: 460px;
            width: 100%;
            padding: 24px;
            color: #e4e4e7;
            max-height: 85vh;
            overflow-y: auto;
            
            /* Kutu açılma animasyon efekti (küçükten normal boyuta) */
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e5a9f2;
            margin-bottom: 12px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 10px;
        }

        .modal-content {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #d4d4d8;
        }

        .modal-content strong {
            color: #ffffff;
        }

        .modal-content h4 {
            color: #e5a9f2;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .modal-content ul {
            padding-left: 18px;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #9c4dcc, #c882d6);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
        }

        .close-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- İLK AÇILIŞ SPLASH EKRANI (Dönen Logolu ve Politikalar) -->
    <div id="splashScreen">
        <div class="splash-top">
            <span class="brand-logo-text">Bxasaran Store</span>
        </div>

        <div class="splash-center">
            <!-- Gezegen Gibi Etrafı Dönen Logo Alanı -->
            <div class="splash-globe-container">
                <div class="orbit-ring"></div>
                <img src="splash_logo.png" alt="Bxasaran Logo" class="splash-logo-img" onerror="this.style.display='none'">
            </div>
            
            <div class="splash-subtitle">Sana en güvenli ve modern uygulamaları getiriyoruz</div>

            <!-- Politika Butonları -->
            <div class="splash-nav">
                <button class="splash-pill" onclick="openModal('guvenlik')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Güvenliğiniz İçin</span>
                </button>
                <button class="splash-pill" onclick="openModal('gizlilik')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span>Gizlilik Politikamız</span>
                </button>
                <button class="splash-pill" onclick="openModal('hakkimizda')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>Hakkımızda & Gelir Politikası</span>
                </button>
            </div>
        </div>

        <div class="splash-bottom">
            <button class="more-btn" onclick="enterStore()">Uygulamaları Gör</button>
            <svg class="bounce-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="enterStore()" style="cursor: pointer;">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </div>

    <!-- ANA UYGULAMA MAĞAZASI İÇERİĞİ -->
    <div class="main-wrapper">
        <div class="container">
            <header>
                <span class="brand-logo-text-main">Bxasaran</span>
                <div class="mini-emblem">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38ef7d" />
                                <stop offset="50%" stop-color="#11998e" />
                                <stop offset="100%" stop-color="#0575E6" />
                            </linearGradient>
                        </defs>
                        <polygon points="50,10 92,85 8,85" fill="#1e2229" />
                        <polygon points="50,10 88,80 74,80 50,34 26,80 70,80 65,70 40,70 50,50" fill="url(#logoGrad)" />
                    </svg>
                </div>
                <span class="brand-logo-text-main">store</span>
            </header>

            <div class="search-container">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Uygulama ara..." onkeyup="filterApps()">
            </div>

            <div class="section-header">
                <h2 class="section-title">Uygulamalar</h2>
                <span class="app-count" id="appCount">0 Uygulama</span>
            </div>

            <main class="apps-list" id="appsContainer">
                <!-- Dinamik yükleniyor -->
            </main>
        </div>
    </div>

    <!-- ANİMASYONLU MODAL PENCERE YAPISI -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Başlık</h3>
            <div class="modal-content" id="modalBody">İçerik</div>
            <button class="close-btn" onclick="closeModal()">Anladım, Kapat</button>
        </div>
    </div>

    <script>
        function enterStore() {
            const splash = document.getElementById('splashScreen');
            splash.classList.add('slide-up');
        }

        let touchstartY = 0;
        let touchendY = 0;

        document.getElementById('splashScreen').addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        }, false);

        document.getElementById('splashScreen').addEventListener('touchend', e => {
            touchendY = e.changedTouches[0].screenY;
            if (touchendY < touchstartY - 50) {
                enterStore();
            }
        }, false);

        let allApps = [];

        async function fetchApps() {
            try {
                const response = await fetch('apps.json');
                allApps = await response.json();
                renderApps(allApps);
            } catch (error) {
                console.error("Uygulamalar yüklenirken hata oluştu:", error);
                document.getElementById('appsContainer').innerHTML = '<div class="no-result">Uygulamalar yüklenemedi. apps.json dosyasını kontrol edin.</div>';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('appsContainer');
            document.getElementById('appCount').innerText = `${apps.length} Uygulama`;
            
            if (apps.length === 0) {
                container.innerHTML = '<div class="no-result">Aradığınız kriterde uygulama bulunamadı.</div>';
                return;
            }

            container.innerHTML = apps.map(app => `
                <a href="${app.downloadUrl}" class="modern-app-card">
                    <div class="app-left">
                        <img src="${app.iconUrl}" alt="${app.name}" class="app-icon" onerror="this.src='basaran_logo.png'">
                        <div class="app-info">
                            <span class="app-name">${app.name}</span>
                            <div class="app-meta">
                                <span class="tag-free">Ücretsiz</span>
                                <span>• ${app.category}</span>
                            </div>
                        </div>
                    </div>
                    <div class="download-pill">İndir</div>
                </a>
            `).join('');
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => 
                app.name.toLowerCase().includes(query) || 
                app.category.toLowerCase().includes(query)
            );
            renderApps(filtered);
        }

        window.onload = fetchApps;

        const modalData = {
            guvenlik: {
                title: "Güvenliğiniz İçin Yalnızca Sitemizden İndirin!",
                body: `Uygulamalarımızın güvenliği, bütünlüğü ve güncelliği yalnızca resmi web sitemiz <strong>Bxasaran Store</strong> tarafından garanti edilmektedir.<br><br>
                Web sitemiz dışında (üçüncü taraf APK siteleri, forumlar, Telegram kanalları veya dosya paylaşım platformları aracılığıyla) yayımlanan hiçbir dosya <strong>tarafımıza ait değildir</strong>. Cihazınızın güvenliği için uygulamalarımızı <strong>asla başka bir kaynaktan indirmeyiniz</strong>.`
            },
            gizlilik: {
                title: "Bxasaran Store Gizlilik Politikası",
                body: `
                <h4>1. Gizlilik Politikası</h4>
                <strong>Bxasaran</strong>, sunduğu tüm mobil uygulamaları ve araçları tamamen ücretsiz olarak geliştirmiştir. Bu HİZMET, Bxasaran tarafından ücretsiz olarak sağlanmakta ve olduğu gibi kullanılmak üzere tasarlanmıştır. Bu sayfa, ziyaretçileri Hizmetimizi kullanmaya karar veren herhangi biri için Kişisel Bilgilerin toplanması, kullanılması ve ifşa edilmesi ile ilgili politikalarımız hakkında bilgilendirmek için kullanılır. Servisimizi kullanmayı tercih ederseniz, bu politika ile ilgili olarak bilgi toplanması ve kullanılmasını kabul etmiş olursunuz. Bilgilerinizi bu Gizlilik Politikası'nda açıklandığı şekilde dışında kimseyle kullanmayacağız veya paylaşmayacağız.

                <h4>2. Bilgi Toplama ve Kullanımı</h4>
                Daha iyi bir deneyim için Servisimizi kullanırken, uygulama içi temel işlevleri sağlamak amacıyla üçüncü taraf servis sağlayıcılarından yararlanılabilir. Uygulamalarımız doğrudan sizden ad, soyad, adres veya ödeme bilgisi talep etmez. Kullanılan üçüncü taraf hizmet sağlayıcıları şunlar olabilir:
                <ul>
                    <li>Google Play Hizmetleri</li>
                    <li>Google Mobil Reklamlar (AdMob)</li>
                    <li>Firebase Analitik ve Çökme Raporları</li>
                </ul>

                <h4>3. Günlük (Log) Verileri</h4>
                Servisimizi kullandığınız zaman, uygulamada teknik bir hata oluştuğunda cihazınızda 'Log Verisi' adı altında teknik analiz verilerinin (üçüncü parti hata takip ürünleri aracılığıyla) toplanabileceğini bilmenizi isteriz. Bu Günlük Verileri; cihazınızın İnternet Protokolü ("IP") adresi, cihaz modeli, Android işletim sistemi sürümü, uygulama yapılandırması, kullanım zamanı ve tarihi gibi yalnızca hata ayıklamaya yönelik istatistikleri içerebilir. Ayrıca kötüye kullanımı ve modifikasyon girişimlerini önlemek amacıyla uygulama bütünlük doğrulamaları kullanılabilir.

                <h4>4. Çerezler (Cookies)</h4>
                Çerezler, genellikle anonim benzersiz tanımlayıcılar olarak kullanılan az miktarda veri içeren dosyalardır. Bu Servis doğrudan çerez kullanmaz; ancak uygulamalarımız ve web sitemiz, reklam gösterimi veya performans iyileştirmesi için çerezleri kullanan üçüncü parti kod ve kütüphaneleri barındırabilir. Tarayıcı veya cihaz ayarlarınızdan çerezleri reddetme seçeneğine sahipsiniz.

                <h4>5. Servis Sağlayıcıları</h4>
                Hizmetimizi kolaylaştırmak, uygulama performansını analiz etmek veya standart reklam gösterimlerini sağlamak amacıyla güvenilir üçüncü parti altyapılarla çalışabiliriz. Bu servis sağlayıcıları yalnızca kendilerine verilen teknik görevleri yerine getirmek amacıyla anonim verilere erişebilir ve bilgileri başka bir amaçla kullanmamakla yükümlüdür.

                <h4>6. Güvenlik</h4>

                <h4>9. Gizlilik Politikasındaki Değişiklikler</h4>
                Gizlilik Politikamızı zaman zaman güncelleyebiliriz. Değişiklikler bu sayfada yayınlandığı andan itibaren geçerli olur. Bu politika en son <strong>2026</strong> yılı itibarıyla güncellenmiştir.

                <h4>10. Takip ve Cihaz Teknik Veri Açıklaması</h4>
                Uygulamalarımız, yalnızca Android cihazlarda uyumluluğu, kararlılığı ve genel kullanıcı deneyimini iyileştirmek için cihazınızın üreticisi, modeli, işletim sistemi sürümü, CPU mimarisi ve ekran özellikleri gibi kişisel olmayan sınırlı teknik bilgileri işleyebilir. Bu veriler hiçbir şekilde ad, e-posta, telefon numarası veya kesin konum bilgisi içermez ve kullanıcı profilleme amacıyla satılmaz.

                <h4>11. Gizlilik Haklarınız</h4>
                Kullanıcılarımız; kendileriyle ilgili işlenen teknik veriler hakkında bilgi alma, hatalı verilerin düzeltilmesini isteme, verilerin silinmesini talep etme ve kişiselleştirilmiş reklam izlemesine itiraz etme haklarına sahiptir.

                <h4>12. Veri Saklama Politikası</h4>
                Hizmetlerimizi sunmak ve teknik hataları gidermek için gereken süre boyunca anonim analiz verileri tutulur. İhtiyaç kalmadığında tüm teknik kayıtlar otomatik olarak anonimleştirilir veya silinir.

                <h4>15. Bize Ulaşın</h4>

        function openModal(type) {
            document.getElementById('modalTitle').innerHTML = modalData[type].title;
            document.getElementById('modalBody').innerHTML = modalData[type].body;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
