<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Uygulama Mağazası</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4CAF50; margin-bottom: 10px; }
        .ust-bar { text-align: center; margin-bottom: 20px; display: none; }
        .uygulama-ac-btn { background-color: #2196F3; color: white; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; }
        .uygulama-listesi { max-width: 600px; margin: 0 auto; }
        .kart { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .bilgi { display: flex; align-items: center; gap: 15px; }
        .ikon { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
        .detay h3 { margin: 0 0 5px 0; font-size: 18px; }
        .detay p { margin: 0; font-size: 13px; color: #bbbbbb; }
        .surum { font-size: 11px; color: #4CAF50; margin-top: 4px; display: block; }
        .indir-btn { background-color: #4CAF50; color: white; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .indir-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h1>Bxasaran App Store</h1>
    
    <!-- Sadece Android tarayıcılarda görünecek "Uygulamada Aç" butonu -->
    <div class="ust-bar" id="appBanner">
        <a href="intent://store#Intent;scheme=bxasaran;package=com.bxasaran.store;end" class="uygulama-ac-btn">📱 Mağaza Uygulamasında Aç</a>
    </div>

    <div class="uygulama-listesi" id="liste">Yükleniyor...</div>

    <script>
        // 1. Uygulamaları Listele (Senin çalışan orijinal kodun)
        fetch('apps.json')
            .then(res => res.json())
            .then(data => {
                const liste = document.getElementById('liste');
                liste.innerHTML = '';
                data.forEach(app => {
                    liste.innerHTML += `
                        <div class="kart">
                            <div class="bilgi">
                                <img src="${app.ikon}" class="ikon" alt="ikon">
                                <div class="detay">
                                    <h3>${app.ad}</h3>
                                    <p>${app.aciklama}</p>
                                    <span class="surum">Sürüm: ${app.surum}</span>
                                </div>
                            </div>
                            <a href="${app.apk_url}" class="indir-btn" download>İndir</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('liste').innerText = 'Uygulamalar yüklenemedi.';
            });

        // 2. Sayfa yüklendikten sonra güvenli Android uygulama yönlendirmesi
        window.addEventListener('load', function() {
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isInsideApp = window.location.search.includes("app=1");

            if (isAndroid && !isInsideApp) {
                // Üstteki "Uygulamada Aç" butonunu görünür yap
                document.getElementById('appBanner').style.display = 'block';

                // Sayfayı bozmadan arka planda gizli çerçeve ile uygulamayı tetikle
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = 'bxasaran://store';
                document.body.appendChild(iframe);
            }
        });
    </script>

</body>
</html>
