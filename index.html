<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Uygulama Mağazası</title>
    <script>
        // Sadece Android tarayıcılardan girildiğinde uygulamaya yönlendirmeyi dener
        if (/Android/i.test(navigator.userAgent) && !window.location.search.includes("app=1")) {
            window.location.href = "bxasaran://store";
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4CAF50; }
        .uygulama-listesi { max-width: 600px; margin: 0 auto; }
        .kart { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .bilgi { display: flex; align-items: center; gap: 15px; }
        .ikon { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
        .detay h3 { margin: 0 0 5px 0; font-size: 18px; }
        .detay p { margin: 0; font-size: 13px; color: #bbbbbb; }
        .surum { font-size: 11px; color: #4CAF50; margin-top: 4px; display: block; }
        .indir-btn { background-color: #4CAF50; color: white; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .indir-btn:hover { background-color: #45a049; }
        .hata { color: #ff5252; text-align: center; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Bxasaran App Store</h1>
    <div class="uygulama-listesi" id="liste">Uygulamalar yükleniyor...</div>

    <script>
        // Önbellek sorununu aşmak için rastgele bir parametre ekleyelim
        fetch('apps.json?v=' + new Date().getTime())
            .then(res => {
                if (!res.ok) {
                    throw new Error("JSON dosyası okunamadı! (HTTP " + res.status + ")");
                }
                return res.json();
            })
            .then(data => {
                const liste = document.getElementById('liste');
                liste.innerHTML = '';
                
                if (data.length === 0) {
                    liste.innerHTML = '<div class="hata">Henüz mağazada uygulama yok.</div>';
                    return;
                }

                data.forEach(app => {
                    liste.innerHTML += `
                        <div class="kart">
                            <div class="bilgi">
                                <img src="${app.ikon}" class="ikon" alt="ikon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/226/226770.png'">
                                <div class="detay">
                                    <h3>${app.ad}</h3>
                                    <p>${app.aciklama}</p>
                                    <span class="surum">Sürüm: ${app.surum}</span>
                                </div>
                            </div>
                            <a href="${app.apk_url}" class="indir-btn" download>İndir</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('liste').innerHTML = `
                    <div class="hata">
                        <b>Hata Oluştu:</b> ${err.message}<br><br>
                        Lütfen <b>apps.json</b> dosyanızın tırnak ve süslü parantez kurallarına uygun olduğundan emin olun.
                    </div>
                `;
            });
    </script>

</body>
</html>
