<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #060608;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.35);
            border-radius: 10px;
        }

        body {
            background-color: #060608;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- 1. EKRAN: AKICI NEON SPLASH & POLİTİKALAR --- */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: #060608;
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 36px 18px 28px;
            overflow: hidden;
            transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease;
        }

        /* Akıcı Neon Arka Plan Hareketi */
        #splashScreen::before,
        #splashScreen::after {
            content: '';
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            pointer-events: none;
            animation: neonDrift 8s ease-in-out infinite alternate;
        }

        #splashScreen::before {
            background: rgba(168, 85, 247, 0.28);
            top: -80px;
            left: -60px;
        }

        #splashScreen::after {
            background: rgba(56, 239, 125, 0.16);
            bottom: -80px;
            right: -60px;
            animation-delay: -4s;
        }

        @keyframes neonDrift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 45px) scale(1.15); }
        }

        #splashScreen.slide-up {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .splash-header {
            text-align: center;
            margin-top: 10px;
        }

        .brand-neon-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #e879f9, #a855f7, #38ef7d, #e879f9);
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonTextFlow 5s linear infinite;
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.45));
        }

        @keyframes neonTextFlow {
            to { background-position: 250% center; }
        }

        .splash-subtitle {
            font-size: 0.88rem;
            color: #a1a1aa;
            margin-top: 8px;
            max-width: 280px;
            line-height: 1.45;
        }

        /* Orta Kısım: Neon Politika Kartları (Logosuz) */
        .splash-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 440px;
            margin: auto 0;
        }

        .splash-pill {
            position: relative;
            background: rgba(18, 18, 24, 0.72);
            border: 1px solid rgba(192, 132, 252, 0.25);
            border-radius: 16px;
            padding: 15px 18px;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 0 12px rgba(168, 85, 247, 0.05);
        }

        .pill-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .splash-pill svg.pill-icon {
            width: 20px;
            height: 20px;
            stroke: #c084fc;
            filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.6));
            flex-shrink: 0;
        }

        .splash-pill svg.pill-arrow {
            width: 16px;
            height: 16px;
            stroke: #71717a;
            transition: transform 0.25s ease, stroke 0.25s ease;
        }

        .splash-pill:hover, .splash-pill:active {
            background: rgba(168, 85, 247, 0.14);
            border-color: #c084fc;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.25);
        }

        .splash-pill:hover svg.pill-arrow {
            stroke: #e879f9;
            transform: translateX(3px);
        }

        .splash-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .more-btn {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            border: none;
            color: #09090b;
            padding: 13px 36px;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.45);
        }

        .more-btn:active {
            transform: scale(0.96);
        }

        .swipe-hint {
            font-size: 0.72rem;
            color: #71717a;
            letter-spacing: 0.4px;
        }

        /* --- 2. EKRAN: SADECE SEARCH, UYGULAMALAR VE ÖZEL TUTAMAÇ --- */
        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 16px 40px;
            background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.14), transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Üstteki Sadece Tutulup Aşağı Çekilebilen > Butonu */
        .pull-handle-zone {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px 0 6px;
        }

        .pull-btn {
            --pull-progress: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(20, 20, 26, 0.9);
            border: 2px solid rgba(192, 132, 252, calc(0.25 + var(--pull-progress) * 0.75));
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            user-select: none;
            position: relative;
            box-shadow: 
                0 0 calc(var(--pull-progress) * 28px) rgba(168, 85, 247, calc(0.2 + var(--pull-progress) * 0.8)),
                inset 0 0 calc(var(--pull-progress) * 18px) rgba(168, 85, 247, calc(var(--pull-progress) * 0.85));
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.15s ease;
        }

        .pull-btn.dragging {
            transition: none;
            cursor: grabbing;
        }

        /* Çektikçe Etrafını Kaplayan Mor Dairesel Halka */
        .pull-btn::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(
                #a855f7 calc(var(--pull-progress) * 360deg),
                transparent 0deg
            );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #fff calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #fff calc(100% - 3px));
            pointer-events: none;
        }

        .pull-btn svg {
            width: 20px;
            height: 20px;
            stroke: #e9d5ff;
            transform: rotate(90deg); /* > ikonunu aşağı yönlü ok yapar */
            transition: transform 0.2s ease;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 26, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.25);
            border-radius: 16px;
            padding: 12px 16px;
            gap: 12px;
            backdrop-filter: blur(12px);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .search-container:focus-within {
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
        }

        .search-container svg {
            width: 18px;
            height: 18px;
            stroke: #c084fc;
            flex-shrink: 0;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.9rem;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: #71717a;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
        }

        .app-count {
            font-size: 0.75rem;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 14px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .modern-app-card:hover {
            background: rgba(28, 28, 36, 0.9);
            border-color: rgba(192, 132, 252, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #121212;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-size: 0.98rem;
            font-weight: 700;
            color: #ffffff;
        }

        .app-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.74rem;
            color: #a1a1aa;
        }

        .tag-free {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.2);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.68rem;
        }

        .download-pill {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: #09090b;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 9px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
        }

        .no-result {
            text-align: center;
            color: #71717a;
            font-size: 0.86rem;
            padding: 28px 0;
        }

        /* --- ANİMASYONLU MODAL PENCERE (SPLASH ÜSTÜNDE) --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.28s ease, visibility 0.28s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #101014;
            border: 1px solid rgba(192, 132, 252, 0.45);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.3);
            border-radius: 22px;
            max-width: 460px;
            width: 100%;
            padding: 24px;
            color: #e4e4e7;
            max-height: 85vh;
            overflow-y: auto;
            transform: scale(0.88) translateY(18px);
            transition: transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 1.12rem;
            font-weight: 700;
            color: #e9d5ff;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .modal-content {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #d4d4d8;
        }

        .modal-content strong {
            color: #ffffff;
        }

        .modal-content h4 {
            color: #d8b4fe;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 0.94rem;
        }

        .modal-content ul {
            padding-left: 18px;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #9333ea, #c084fc);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 1. GÖRSEL: AKICI NEON SPLASH & POLİTİKA MENÜSÜ -->
    <div id="splashScreen">
        <div class="splash-header">
            <div class="brand-neon-title">Bxasaran Store</div>
            <div class="splash-subtitle">Sana en güvenli ve modern uygulamaları getiriyoruz</div>
        </div>

        <div class="splash-nav">
            <button class="splash-pill" onclick="openModal('guvenlik')">
                <div class="pill-left">
                    <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Güvenliğiniz İçin</span>
                </div>
                <svg class="pill-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <button class="splash-pill" onclick="openModal('gizlilik')">
                <div class="pill-left">
                    <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span>Gizlilik Politikamız</span>
                </div>
                <svg class="pill-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <button class="splash-pill" onclick="openModal('hakkimizda')">
                <div class="pill-left">
                    <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>Hakkımızda & Gelir Politikası</span>
                </div>
                <svg class="pill-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <div class="splash-bottom">
            <button class="more-btn" onclick="enterStore()">Uygulamaları Gör</button>
            <span class="swipe-hint">veya mağaza için yukarı kaydırın</span>
        </div>
    </div>

    <!-- 2. GÖRSEL: SADECE TUTAMAÇ BUTON, SEARCH VE UYGULAMALAR -->
    <div class="main-wrapper">
        <div class="container">
            <!-- Sadece bu > butonu tutulup aşağı çekildiğinde mor dolar ve 1. ekrana döner -->
            <div class="pull-handle-zone">
                <div class="pull-btn" id="pullHandleBtn" title="Menüye dönmek için aşağı çekin">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>

            <div class="search-container">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Uygulama ara..." onkeyup="filterApps()">
            </div>

            <div class="section-header">
                <h2 class="section-title">Uygulamalar</h2>
                <span class="app-count" id="appCount">0 Uygulama</span>
            </div>

            <main class="apps-list" id="appsContainer">
                <!-- Dinamik yükleniyor -->
            </main>
        </div>
    </div>

    <!-- POLİTİKA MODAL PENCERESİ -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Başlık</h3>
            <div class="modal-content" id="modalBody">İçerik</div>
            <button class="close-btn" onclick="closeModal()">Anladım, Kapat</button>
        </div>
    </div>

    <script>
        const splash = document.getElementById('splashScreen');
        const pullBtn = document.getElementById('pullHandleBtn');

        function enterStore() {
            splash.classList.add('slide-up');
        }

        function returnToSplash() {
            splash.classList.remove('slide-up');
        }

        // 1. Ekranda yukarı kaydırma (Swipe Up) ile mağazayı açma
        let splashTouchStartY = 0;
        splash.addEventListener('touchstart', e => {
            splashTouchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        splash.addEventListener('touchend', e => {
            const splashTouchEndY = e.changedTouches[0].screenY;
            if (splashTouchEndY < splashTouchStartY - 55) {
                enterStore();
            }
        }, { passive: true });

        // 2. Ekranda SADECE > butonunu tutup aşağı çekince mor dolma ve 1. menüye dönme
        let isPulling = false;
        let pullStartY = 0;
        const maxPullDistance = 120; // Tam dolum için gereken piksel mesafesi

        function startPull(clientY) {
            isPulling = true;
            pullStartY = clientY;
            pullBtn.classList.add('dragging');
        }

        function movePull(clientY) {
            if (!isPulling) return;
            const deltaY = Math.max(0, clientY - pullStartY);
            const progress = Math.min(1, deltaY / maxPullDistance);
            const visualTranslate = Math.min(deltaY * 0.55, 70);

            pullBtn.style.setProperty('--pull-progress', progress.toFixed(3));
            pullBtn.style.transform = `translateY(${visualTranslate}px) scale(${1 + progress * 0.12})`;
        }

        function endPull(clientY) {
            if (!isPulling) return;
            isPulling = false;
            pullBtn.classList.remove('dragging');

            const deltaY = Math.max(0, clientY - pullStartY);
            const progress = Math.min(1, deltaY / maxPullDistance);

            // Butonu eski yerine yumuşakça sıfırla
            pullBtn.style.setProperty('--pull-progress', '0');
            pullBtn.style.transform = 'translateY(0) scale(1)';

            // Yeterince çekildiyse 1. görseldeki menüye geri dön
            if (progress >= 0.85) {
                returnToSplash();
            }
        }

        // Dokunmatik (Mobil) olayları - sadece pullBtn üzerinde aktif
        pullBtn.addEventListener('touchstart', e => {
            e.stopPropagation();
            startPull(e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('touchmove', e => {
            if (isPulling) {
                movePull(e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (isPulling) {
                endPull(e.changedTouches[0].clientY);
            }
        });

        // Fare (Bilgisayar) desteği - sadece pullBtn üzerinde aktif
        pullBtn.addEventListener('mousedown', e => {
            e.preventDefault();
            startPull(e.clientY);
        });

        window.addEventListener('mousemove', e => {
            if (isPulling) {
                movePull(e.clientY);
            }
        });

        window.addEventListener('mouseup', e => {
            if (isPulling) {
                endPull(e.clientY);
            }
        });

        // --- UYGULAMALARI YÜKLEME VE ARAMA ---
        let allApps = [];

        async function fetchApps() {
            try {
                const response = await fetch('apps.json');
                allApps = await response.json();
                renderApps(allApps);
            } catch (error) {
                console.error("Uygulamalar yüklenirken hata oluştu:", error);
                document.getElementById('appsContainer').innerHTML = '<div class="no-result">Uygulamalar yüklenemedi. apps.json dosyasını kontrol edin.</div>';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('appsContainer');
            document.getElementById('appCount').innerText = `${apps.length} Uygulama`;
            
            if (apps.length === 0) {
                container.innerHTML = '<div class="no-result">Aradığınız kriterde uygulama bulunamadı.</div>';
                return;
            }

            container.innerHTML = apps.map(app => `
                <a href="${app.downloadUrl}" class="modern-app-card">
                    <div class="app-left">
                        <img src="${app.iconUrl}" alt="${app.name}" class="app-icon" onerror="this.src='basaran_logo.png'">
                        <div class="app-info">
                            <span class="app-name">${app.name}</span>
                            <div class="app-meta">
                                <span class="tag-free">Ücretsiz</span>
                                <span>• ${app.category}</span>
                            </div>
                        </div>
                    </div>
                    <div class="download-pill">İndir</div>
                </a>
            `).join('');
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app =>
