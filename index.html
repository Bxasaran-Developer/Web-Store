<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #030712;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.4);
            border-radius: 10px;
        }

        /* 1. EKRAN: SPLASH & POLİTİKALAR */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #030712 0%, #0b1329 100%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 18px 32px;
            overflow: hidden;
            transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease;
        }

        #splashScreen::before,
        #splashScreen::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(110px);
            z-index: -1;
            pointer-events: none;
            animation: blueDrift 10s ease-in-out infinite alternate;
        }

        #splashScreen::before {
            background: rgba(29, 78, 216, 0.35);
            top: -100px;
            left: -80px;
        }

        #splashScreen::after {
            background: rgba(14, 165, 233, 0.22);
            bottom: -100px;
            right: -80px;
            animation-delay: -5s;
        }

        @keyframes blueDrift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(45px, 55px) scale(1.2); }
        }

        #splashScreen.slide-up {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .splash-header {
            text-align: center;
            margin-top: 10px;
        }

        .brand-neon-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            background: linear-gradient(90deg, #60a5fa, #3b82f6, #38bdf8, #60a5fa);
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonTextFlow 5s linear infinite;
            filter: drop-shadow(0 0 22px rgba(59, 130, 246, 0.6));
        }

        @keyframes neonTextFlow {
            to { background-position: 250% center; }
        }

        .splash-subtitle {
            font-size: 0.88rem;
            color: #94a3b8;
            margin-top: 8px;
            max-width: 280px;
            line-height: 1.45;
        }

        .splash-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 440px;
        }

        .splash-pill {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 58, 138, 0.4));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px 18px;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px rgba(3, 7, 18, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .pill-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .splash-pill svg.pill-icon {
            width: 21px;
            height: 21px;
            stroke: #60a5fa;
            filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.7));
            flex-shrink: 0;
        }

        .splash-pill svg.pill-arrow {
            width: 16px;
            height: 16px;
            stroke: #64748b;
            transition: transform 0.25s ease, stroke 0.25s ease;
        }

        .splash-pill:hover, .splash-pill:active {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.5), rgba(37, 99, 235, 0.3));
            border-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.35);
        }

        .splash-pill:hover svg.pill-arrow {
            stroke: #93c5fd;
            transform: translateX(4px);
        }

        .bottom-drawer-handle {
            width: 100%;
            max-width: 440px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: grab;
            touch-action: none;
            user-select: none;
            transition: transform 0.25s ease;
        }

        .bottom-drawer-text {
            font-size: 0.92rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.4px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        .bottom-drawer-arrow {
            width: 20px;
            height: 20px;
            stroke: #60a5fa;
            filter: drop-shadow(0 0 8px #3b82f6);
            animation: bounceUp 1.8s infinite;
        }

        @keyframes bounceUp {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-2px); }
        }

        /* 2. EKRAN: MAĞAZA EKRANI */
        #storeScreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: linear-gradient(135deg, #030712 0%, #090f22 100%);
            background-image: 
                radial-gradient(circle at 50% -5%, rgba(37, 99, 235, 0.25), transparent 50%),
                radial-gradient(circle at 90% 60%, rgba(14, 165, 233, 0.1), transparent 45%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 50px;
            z-index: 100;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .search-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 58, 138, 0.3));
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 18px;
            padding: 13px 16px;
            gap: 12px;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(3, 7, 18, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .search-container:focus-within {
            border-color: #60a5fa;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
        }

        .search-container svg {
            width: 19px;
            height: 19px;
            stroke: #60a5fa;
            flex-shrink: 0;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.92rem;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        /* 0.5 Saniye Basılı Tutma Butonu */
        .neon-side-btn {
            --hold-progress: 0;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: radial-gradient(circle at 30% 30%, #1e3a8a, #0b1329);
            border: 2px solid rgba(96, 165, 250, calc(0.4 + var(--hold-progress) * 0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 6px 20px rgba(3, 7, 18, 0.6),
                0 0 calc(10px + var(--hold-progress) * 35px) rgba(59, 130, 246, calc(0.4 + var(--hold-progress) * 0.6));
            transition: transform 0.2s ease;
        }

        .neon-side-btn.holding {
            transform: scale(0.95);
        }

        .neon-side-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 18px;
            background: conic-gradient(
                #38bdf8 calc(var(--hold-progress) * 360deg),
                transparent 0deg
            );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3.5px));
            pointer-events: none;
            filter: drop-shadow(0 0 8px #3b82f6);
        }

        .neon-side-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(37, 99, 235, calc(var(--hold-progress) * 0.4));
            pointer-events: none;
            transition: background 0.1s ease;
        }

        .neon-side-btn svg {
            width: 22px;
            height: 22px;
            stroke: #f8fafc;
            transform: rotate(180deg);
            filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.9));
            position: relative;
            z-index: 2;
        }

        /* YANA KAYDIRILABİLİR ÖNE ÇIKANLAR ALANI */
        .featured-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .featured-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .featured-card {
            min-width: 280px;
            max-width: 320px;
            flex: 1;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(3, 7, 18, 0.5);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.25s ease;
        }

        .featured-card:hover {
            border-color: rgba(96, 165, 250, 0.7);
        }

        .featured-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, #60a5fa, #2563eb);
        }

        .featured-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .featured-badge {
            font-size: 0.68rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .featured-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .featured-desc {
            font-size: 0.78rem;
            color: #94a3b8;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .featured-btn {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 8px 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* KATEGORİ SEKMELERİ */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 58, 138, 0.3));
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .cat-chip.active {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border-color: #60a5fa;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.45);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px 0;
        }

        .section-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .app-count {
            font-size: 0.75rem;
            color: #93c5fd;
            background: rgba(30, 58, 138, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 11px;
            border-radius: 20px;
            font-weight: 600;
        }

        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 58, 138, 0.25));
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 20px;
            padding: 14px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(3, 7, 18, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .modern-app-card:hover {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4), rgba(37, 99, 235, 0.3));
            border-color: rgba(96, 165, 250, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(3, 7, 18, 0.6), 0 0 20px rgba(59, 130, 246, 0.25);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: #0b1329;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-size: 0.98rem;
            font-weight: 700;
            color: #ffffff;
        }

        .app-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.74rem;
            color: #94a3b8;
        }

        .tag-free {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.68rem;
        }

        .download-pill {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 9px 17px;
            border-radius: 13px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.45);
        }

        .no-result {
            text-align: center;
            color: #64748b;
            font-size: 0.86rem;
            padding: 28px 0;
        }

        /* TOAST BİLDİRİMİ */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(96, 165, 250, 0.6);
            color: #f8fafc;
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4), 0 0 20px rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 3000;
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            pointer-events: none;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* MODAL VE DETAY PENCERESİ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.28s ease, visibility 0.28s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 58, 138, 0.85));
            border: 1px solid rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 45px rgba(37, 99, 235, 0.4);
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            padding: 24px;
            color: #f1f5f9;
            max-height: 85vh;
            overflow-y: auto;
            transform: scale(0.88) translateY(18px);
            transition: transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #93c5fd;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .modal-content {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .modal-content strong {
            color: #ffffff;
        }

        .modal-content h4 {
            color: #93c5fd;
            margin-top: 16px;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .modal-content ul {
            padding-left: 18px;
            margin-top: 6px;
            margin-bottom: 10px;
        }

        .modal-content li {
            margin-bottom: 4px;
        }

        .app-detail-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .app-detail-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            object-fit: cover;
            border: 1px solid rgba(96, 165, 250, 0.4);
            background: #0b1329;
        }

        .app-detail-info h3 {
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 700;
        }

        .app-detail-info p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .app-meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0;
            text-align: center;
        }

        .meta-box {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 10px 6px;
            border-radius: 14px;
        }

        .meta-title {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
        }

        .meta-value {
            font-size: 0.84rem;
            font-weight: 700;
            color: #93c5fd;
            margin-top: 2px;
        }

        .app-desc-box {
            font-size: 0.86rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin: 14px 0;
        }

        .screenshots-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #93c5fd;
            margin-bottom: 8px;
            margin-top: 14px;
        }

        .screenshots-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .screenshot-item {
            width: 120px;
            height: 220px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: #030712;
            flex-shrink: 0;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            text-align: center;
            display: block;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 1. EKRAN: SPLASH & POLİTİKALAR -->
    <div id="splashScreen">
        <div class="splash-header">
            <div class="brand-neon-title">Bxasaran Store</div>
            <div class="splash-subtitle">Sana en güvenli ve modern uygulamaları getiriyoruz</div>
        </div>

        <div class="splash-nav">
            <button class="splash-pill" onclick="openModal('guvenlik')">
                <div class="pill-left">
                    <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Güvenliğiniz İçin</span>
                </div>
                <svg class="pill-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

    <!-- UYGULAMA DETAY VE POLİTİKA MODALI -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Başlık</h3>
            <div class="modal-content" id="modalBody">İçerik</div>

    <script>
        const splash = document.getElementById('splashScreen');
        const storeScreen = document.getElementById('storeScreen');
        const bottomDrawer = document.getElementById('bottomDrawerHandle');
        const sideMenuBtn = document.getElementById('sideMenuBtn');
        const toastMsg = document.getElementById('toastMsg');

        window.addEventListener('DOMContentLoaded', () => {
            const savedState = localStorage.getItem('bxasaran_view');
            if (savedState === 'store') {
                splash.classList.add('slide-up', 'no-anim');
                storeScreen.scrollTop = 0;
            }
        });

        function enterStore() {
            localStorage.setItem('bxasaran_view', 'store');
            splash.classList.remove('no-anim');
            storeScreen.scrollTop = 0;
            splash.classList.add('slide-up');
        }

        function returnToSplash() {
            localStorage.setItem('bxasaran_view', 'splash');
            splash.classList.remove('slide-up');
            setTimeout(() => {
                storeScreen.scrollTop = 0;
            }, 300);
        }

        // 0.5 SANİYE BASILI TUTMA MANTIĞI
        let animationFrame = null;
        let startTime = null;
        const holdDuration = 500;
        let lastClickTime = 0;
        let toastTimeout = null;

        function showToast() {
            toastMsg.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastMsg.classList.remove('show');
            }, 2200);
        }

        function handleButtonInteraction(e) {
            const currentTime = new Date().getTime();
            const timeDiff = currentTime - lastClickTime;
            if (timeDiff < 400 && timeDiff > 0) {
                showToast();
                lastClickTime = 0;
                return;
            }
            lastClickTime = currentTime;
        }

        function startHolding(e) {
            e.preventDefault();
            handleButtonInteraction(e);
            sideMenuBtn.classList.add('holding');
            startTime = performance.now();

            function updateProgress(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(1, elapsed / holdDuration);
                sideMenuBtn.style.setProperty('--hold-progress', progress.toFixed(3));

                if (progress < 1) {
                    animationFrame = requestAnimationFrame(updateProgress);
                } else {
                    cancelHolding();
                    returnToSplash();
                }
            }
            animationFrame = requestAnimationFrame(updateProgress);
        }

        function cancelHolding() {
            if (animationFrame) cancelAnimationFrame(animationFrame);
            sideMenuBtn.classList.remove('holding');
            sideMenuBtn.style.setProperty('--hold-progress', '0');
        }

        sideMenuBtn.addEventListener('touchstart', startHolding, { passive: false });
        sideMenuBtn.addEventListener('touchend', cancelHolding);
        sideMenuBtn.addEventListener('touchcancel', cancelHolding);
        sideMenuBtn.addEventListener('mousedown', startHolding);
        sideMenuBtn.addEventListener('mouseup', cancelHolding);
        sideMenuBtn.addEventListener('mouseleave', cancelHolding);

        // Alt Çekmece Kaydırma
        let drawerStartY = 0;
        let isDrawerDragging = false;

        bottomDrawer.addEventListener('touchstart', e => {
            isDrawerDragging = true;
            drawerStartY = e.touches[0].clientY;
        }, { passive: true });

        bottomDrawer.addEventListener('touchmove', e => {
            if (!isDrawerDragging) return;
            const deltaY = drawerStartY - e.touches[0].clientY;
            if (deltaY > 0) {
                bottomDrawer.style.transform = `translateY(${-Math.min(deltaY * 0.4, 24)}px)`;
            }
        }, { passive: true });

        bottomDrawer.addEventListener('touchend', e => {
            if (!isDrawerDragging) return;
            isDrawerDragging = false;
            bottomDrawer.style.transform = 'translateY(0)';
            const deltaY = drawerStartY - e.changedTouches[0].clientY;
            if (deltaY > 40) {
                enterStore();
            }
        });

        bottomDrawer.addEventListener('mousedown', e => {
            isDrawerDragging = true;
            drawerStartY = e.clientY;
        });

        window.addEventListener('mousemove', e => {
            if (!isDrawerDragging) return;
            const deltaY = drawerStartY - e.clientY;
            if (deltaY > 0) {
                bottomDrawer.style.transform = `translateY(${-Math.min(deltaY * 0.4, 24)}px)`;
            }
        });

        window.addEventListener('mouseup', e => {
            if (!isDrawerDragging) return;
            isDrawerDragging = false;
            bottomDrawer.style.transform = 'translateY(0)';
            const deltaY = drawerStartY - e.clientY;
            if (deltaY > 40) {
                enterStore();
            }
        });

        // UYGULAMALAR VE ÖNE ÇIKANLAR YÖNETİMİ
        let allApps = [];
        let currentCategory = 'Tümü';

        async function fetchApps() {
            try {
                const response = await fetch('apps.json');
                allApps = await response.json();
                buildCategories();
                renderFeatured();
                renderApps(allApps);
            } catch (error) {
                console.error("Uygulamalar yüklenirken hata oluştu:", error);
                document.getElementById('appsContainer').innerHTML = '<div class="no-result">Uygulamalar yüklenemedi. apps.json dosyasını kontrol edin.</div>';
            }
        }

        function buildCategories() {
            const categoriesScroll = document.getElementById('categoriesScroll');
            const categories = ['Tümü', ...new Set(allApps.map(app => app.category).filter(Boolean))];

            categoriesScroll.innerHTML = categories.map((cat, idx) => `
                <div class="cat-chip ${idx === 0 ? 'active' : ''}" onclick="filterByCategory('${cat}', this)">${cat}</div>
            `).join('');
        }

        function renderFeatured() {
            const container = document.getElementById('featuredContainer');
            const featuredApps = allApps.map((app, index) => ({ app, index })).filter(item => item.app.featured === true);

            if (featuredApps.length > 0) {
                container.innerHTML = featuredApps.map(item => `
                    <div class="featured-card" onclick="openAppDetail(${item.index})">
                        <div class="featured-content">
                            <span class="featured-badge">Öne Çıkan</span>
                            <div class="featured-title">${item.app.name}</div>
                            <div class="featured-desc">${item.app.description || item.app.category}</div>
                        </div>
                        <button class="featured-btn">İncele</button>
                    </div>
                `).join('');
                container.style.display = 'flex';
            } else {
                container.style.display = 'none';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('appsContainer');
            document.getElementById('appCount').innerText = `${apps.length} Uygulama`;
            
            if (apps.length === 0) {
                container.innerHTML = '<div class="no-result">Aradığınız kriterde uygulama bulunamadı.</div>';
                return;
            }

            container.innerHTML = apps.map((app) => {
                const originalIndex = allApps.indexOf(app);
                return `
                    <div class="modern-app-card" onclick="openAppDetail(${originalIndex})">
                        <div class="app-left">
                            <img src="${app.iconUrl}" alt="${app.name}" class="app-icon" onerror="this.src='basaran_logo.png'">
                            <div class="app-info">
                                <span class="app-name">${app.name}</span>
                                <div class="app-meta">
                                    <span class="tag-free">Ücretsiz</span>
                                    <span>• ${app.category}</span>
                                </div>
                            </div>
                        </div>
                        <div class="download-pill">İncele</div>
                    </div>
                `;
            }).join('');
        }

        function filterByCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function filterApps() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const matchesSearch = app.name.toLowerCase().includes(query) || app.category.toLowerCase().includes(query);
                const matchesCategory = currentCategory === 'Tümü' || app.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            renderApps(filtered);
        }

        // UYGULAMA DETAY VE EKRAN GÖRÜNTÜLERİ MODALI
        function openAppDetail(index) {
            const app = allApps[index];
            if (!app) return;

            let screenshotsHtml = '';
            if (app.screenshots && app.screenshots.length > 0) {
                screenshotsHtml = `
                    <div class="screenshots-title">Ekran Görüntüleri</div>
                    <div class="screenshots-scroll">
                        ${app.screenshots.map(img => `<img src="${img}" class="screenshot-item" onerror="this.style.display='none'">`).join('')}
                    </div>
                `;
            }

            document.getElementById('modalTitle').innerText = "Uygulama Detayı";
            document.getElementById('modalBody').innerHTML = `
                <div class="app-detail-header">
                    <img src="${app.iconUrl}" alt="${app.name}" class="app-detail-icon" onerror="this.src='basaran_logo.png'">
                    <div class="app-detail-info">
                        <h3>${app.name}</h3>
                        <p>${app.category}</p>
                    </div>
                </div>

                <div class="app-meta-grid">
                    <div class="meta-box">
                        <div class="meta-title">Sürüm</div>
                        <div class="meta-value">${app.version || 'v1.0'}</div>
                    </div>
                    <div class="meta-box">
                        <div class="meta-title">Boyut</div>
                        <div class="meta-value">${app.size || '15 MB'}</div>
                    </div>
                    <div class="meta-box">
                        <div class="meta-title">Lisans</div>
                        <div class="meta-value">Ücretsiz</div>
                    </div>
                </div>

                <div class="app-desc-box">
                    <strong>Açıklama:</strong><br>
                    ${app.description || 'Bu uygulama Bxasaran Store güvencesiyle yüksek performans ve güvenli kullanım için optimize edilmiştir.'}
                </div>

                ${screenshotsHtml}

                <a href="${app.downloadUrl}" class="close-btn" style="background: linear-gradient(135deg, #1d4ed8, #3b82f6); margin-top: 20px;">Hemen İndir</a>
            `;
            document.getElementById('infoModal').classList.add('active');
        }

        window.onload = fetchApps;

                body: `<strong>Bxasaran Store</strong> olarak geliştirdiğimiz ve düzenlediğimiz tüm uygulamalar tamamen <strong>ücretsizdir</strong>.<br><br>
                Kullanıcılarımızdan hiçbir şekilde <strong>para, bağış, abonelik ücreti, VIP üyelik veya maddi destek</strong> talep edilmemektedir. Adımıza veya uygulamalarımız üzerinden sizden ücret isteyen hiçbir kişi, kurum veya web sitesine kesinlikle itibar etmeyiniz.<br><br>
                Uygulamalarımızın geliştirme, bakım, güncelleme ve sunucu maliyetlerini karşılayabilmek adına tek gelir kaynağımız <strong>uygulama içi reklamlardır</strong>. Sizlerden herhangi bir ödeme talep edilmez; yalnızca projelerimizi ücretsiz olarak sürdürebilmemizi ve yeni uygulamalar geliştirebilmemizi sağlayan standart reklam gösterimleri mevcuttur.`
            }
        };

        function openModal(type) {
            document.getElementById('modalTitle').innerHTML = modalData[type].title;
            document.getElementById('modalBody').innerHTML = modalData[type].body;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
