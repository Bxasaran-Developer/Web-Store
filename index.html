<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070709;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(168, 85, 247, 0.18), transparent 45%),
                radial-gradient(circle at 85% 40%, rgba(56, 239, 125, 0.06), transparent 40%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- KARŞILAMA (SPLASH) EKRANI STİLLERİ --- */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: #070709;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(200, 130, 214, 0.15), transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(56, 239, 125, 0.08), transparent 40%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            transition: transform 0.7s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.7s ease;
        }

        #splashScreen.slide-up {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .splash-top {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }

        .menu-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 44px;
            height: 44px;
            justify-content: center;
            align-items: center;
        }

        .menu-icon-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background: #c882d6;
            border-radius: 2px;
        }

        .splash-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .splash-globe {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff4b2b, #ff416c, #111);
            box-shadow: 0 0 50px rgba(255, 65, 108, 0.3), inset 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .splash-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .splash-subtitle {
            font-size: 0.95rem;
            color: #a1a1aa;
            max-width: 280px;
            line-height: 1.5;
        }

        .splash-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .more-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 12px 36px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .more-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #c882d6;
        }

        .bounce-arrow {
            width: 24px;
            height: 24px;
            stroke: #c882d6;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* --- ANA UYGULAMA İÇERİK STİLLERİ (Mevcut Tasarımın) --- */
        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand-logo-text-main {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: 0.5px;
        }

        .mini-emblem {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 10px rgba(56, 239, 125, 0.4));
        }

        .modern-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(24, 24, 30, 0.75);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(200, 130, 214, 0.25);
            backdrop-filter: blur(12px);
        }

        .nav-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 13px;
            padding: 10px 6px;
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
            font-size: 0.74rem;
            font-weight: 600;
            line-height: 1.25;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .nav-pill svg {
            width: 16px;
            height: 16px;
            stroke: #c882d6;
        }

        .nav-pill:hover, .nav-pill:active {
            background: rgba(200, 130, 214, 0.16);
            border-color: rgba(200, 130, 214, 0.5);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(200, 130, 214, 0.25);
            border-radius: 14px;
            padding: 10px 14px;
            gap: 10px;
            backdrop-filter: blur(8px);
        }

        .search-container svg {
            width: 18px;
            height: 18px;
            stroke: #c882d6;
            flex-shrink: 0;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.88rem;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: #71717a;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: -6px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
        }

        .app-count {
            font-size: 0.75rem;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .modern-app-card:hover {
            background: rgba(30, 30, 38, 0.95);
            border-color: rgba(200, 130, 214, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #121212;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .app-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        .tag-free {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.68rem;
        }

        .download-pill {
            background: linear-gradient(135deg, #9c4dcc, #c882d6);
            color: #09090b;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 9px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(200, 130, 214, 0.3);
        }

        .no-result {
            text-align: center;
            color: #71717a;
            font-size: 0.85rem;
            padding: 20px 0;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #111115;
            border: 1px solid #c882d6;
            box-shadow: 0 0 25px rgba(200, 130, 214, 0.35);
            border-radius: 18px;
            max-width: 460px;
            width: 100%;
            padding: 24px;
            color: #e4e4e7;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e5a9f2;
            margin-bottom: 12px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 10px;
        }

        .modal-content {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #d4d4d8;
        }

        .modal-content strong {
            color: #ffffff;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #9c4dcc, #c882d6);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- YENİ: GİRİŞ SPLASH EKRANI (Açılış Karşılama Menüsü) -->
    <div id="splashScreen">
        <div class="splash-top">
            <div class="menu-icon-btn" onclick="enterStore()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="splash-center">
            <div class="splash-globe">
                <div class="splash-logo-text">Bxasaran</div>
            </div>
            <div class="splash-subtitle">Sana en güvenli ve modern uygulamaları getiriyoruz</div>
        </div>

        <div class="splash-bottom">
            <button class="more-btn" onclick="enterStore()">DAHA FAZLA OKU</button>
            <svg class="bounce-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="enterStore()" style="cursor: pointer;">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </div>

    <!-- MEVCUT UYGULAMA MAĞAZASI İÇERİĞİ -->
    <div class="main-wrapper">
        <div class="container">
            <header>
                <span class="brand-logo-text-main">Bxasaran</span>
                <div class="mini-emblem">
                    <svg viewBox="0 0 100 100" width="30" height="30">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38ef7d" />
                                <stop offset="50%" stop-color="#11998e" />
                                <stop offset="100%" stop-color="#0575E6" />
                            </linearGradient>
                        </defs>
                        <polygon points="50,10 92,85 8,85" fill="#1e2229" />
                        <polygon points="50,10 88,80 74,80 50,34 26,80 70,80 65,70 40,70 50,50" fill="url(#logoGrad)" />
                    </svg>
                </div>
                <span class="brand-logo-text-main">store</span>
            </header>

            <nav class="modern-nav">
                <button class="nav-pill" onclick="openModal('guvenlik')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Güvenliğiniz<br>İçin</span>
                </button>
                <button class="nav-pill" onclick="openModal('gizlilik')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span>Gizlilik<br>Politikamız</span>
                </button>
                <button class="nav-pill" onclick="openModal('hakkimizda')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>Hakkımızda &<br>Gelir Politikası</span>
                </button>
            </nav>

            <div class="search-container">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Uygulama ara..." onkeyup="filterApps()">
            </div>

            <div class="section-header">
                <h2 class="section-title">Uygulamalar</h2>
                <span class="app-count" id="appCount">0 Uygulama</span>
            </div>

            <main class="apps-list" id="appsContainer">
                <!-- Dinamik yükleniyor -->
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Başlık</h3>
            <div class="modal-content" id="modalBody">İçerik</div>
            <button class="close-btn" onclick="closeModal()">Anladım, Kapat</button>
        </div>
    </div>

    <script>
        // Sayfayı yukarı kaydırarak mağazaya geçiş fonksiyonu
        function enterStore() {
            const splash = document.getElementById('splashScreen');
            splash.classList.add('slide-up');
        }

        // Dokunarak yukarı kaydırma (Swipe Up) desteği ekleme
        let touchstartY = 0;
        let touchendY = 0;

        document.getElementById('splashScreen').addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        }, false);

        document.getElementById('splashScreen').addEventListener('touchend', e => {
            touchendY = e.changedTouches[0].screenY;
            if (touchendY < touchstartY - 50) {
                enterStore(); // Yukarı kaydırıldıysa aç
            }
        }, false);

        let allApps = [];

        async function fetchApps() {
            try {
                const response = await fetch('apps.json');
                allApps = await response.json();
                renderApps(allApps);
            } catch (error) {
                console.error("Uygulamalar yüklenirken hata oluştu:", error);
                document.getElementById('appsContainer').innerHTML = '<div class="no-result">Uygulamalar yüklenemedi. apps.json dosyasını kontrol edin.</div>';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('appsContainer');
            document.getElementById('appCount').innerText = `${apps.length} Uygulama`;
            
            if (apps.length === 0) {
                container.innerHTML = '<div class="no-result">Aradığınız kriterde uygulama bulunamadı.</div>';
                return;
            }

            container.innerHTML = apps.map(app => `
                <a href="${app.downloadUrl}" class="modern-app-card">
                    <div class="app-left">
                        <img src="${app.iconUrl}" alt="${app.name}" class="app-icon" onerror="this.src='basaran_logo.png'">
                        <div class="app-info">
                            <span class="app-name">${app.name}</span>
                            <div class="app-meta">
                                <span class="tag-free">Ücretsiz</span>
                                <span>• ${app.category}</span>
                            </div>
                        </div>
                    </div>
                    <div class="download-pill">İndir</div>
                </a>
            `).join('');
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allApps.filter(app => 
                app.name.toLowerCase().includes(query) || 
                app.category.toLowerCase().includes(query)
            );
            renderApps(filtered);
        }

        window.onload = fetchApps;

        const modalData = {
            guvenlik: {
                title: "Güvenliğiniz İçin Yalnızca Sitemizden İndirin!",
                body: `Uygulamalarımızın güvenliği, bütünlüğü ve güncelliği yalnızca resmi web sitemiz <strong>Bxasaran Store</strong> tarafından garanti edilmektedir.<br><br>
                Web sitemiz dışında (üçüncü taraf APK siteleri, forumlar, Telegram kanalları veya dosya paylaşım platformları aracılığıyla) yayımlanan hiçbir dosya <strong>tarafımıza ait değildir</strong>. Cihazınızın güvenliği için uygulamalarımızı <strong>asla başka bir kaynaktan indirmeyiniz</strong>.`
            },
            gizlilik: {
                title: "Gizlilik Politikamız ve Veri Güvenliği",
                body: `Sitemiz ve uygulamalarımız üzerinden kullanıcı gizliliğine son derece önem verilmektedir.<br><br>
                1. Ziyaretçilerimizin gizliliğini korumak temel ilkemizdir.<br>
                2. Uygulamalarımız kişisel verilerinizi izinsiz toplamaz.<br>
                3. Çerezler yalnızca site deneyiminizi iyileştirmek amacıyla kullanılabilir.<br>
                4. Paylaştığınız veya indirdiğiniz dosyalar tamamen güvenlidir.<br>
                5. Üçüncü taraf yazılımlarla verileriniz asla paylaşılmaz.<br>
                6. Reklam ortaklarımız yalnızca anonim gösterim verileri işleyebilir.<br>
                7. Sunucu tarafında hiçbir hassas kişisel bilgi depolanmaz.<br>
                8. Güvenlik standartlarımız düzenli olarak güncellenmektedir.<br>
                9. Sitemizi kullanarak bu gizlilik ilkelerini kabul etmiş olursunuz.<br>
                10. Herhangi bir gizlilik endişesinde resmi iletişim kanallarımız üzerinden bizimle her zaman güvenle iletişime geçebilirsiniz.`
            },
            hakkimizda: {
                title: "Hakkımızda & Gelir Politikamız",
                body: `<strong>Bxasaran Store</strong> olarak geliştirdiğimiz ve düzenlediğimiz tüm uygulamalar tamamen <strong>ücretsizdir</strong>.<br><br>
                Kullanıcılarımızdan hiçbir şekilde <strong>para, bağış, abonelik ücreti veya maddi destek</strong> talep edilmemektedir. Adımıza veya uygulamalarımız üzerinden sizden para isteyen hiçbir kişi, kurum veya siteye itibar etmeyiniz.<br><br>
                Uygulamalarımızın geliştirme, bakım ve sunucu maliyetlerini karşılayabilmek adına tek gelir kaynağımız <strong>uygulama içi reklamlardır</strong>. Sizlerden herhangi bir ödeme veya bağış talep edilmez; yalnızca projelerimizi sürdürebilmemizi sağlayan standart reklam gösterimleri mevcuttur.`
            }
        };

        function openModal(type) {
            document.getElementById('modalTitle').innerHTML = modalData[type].title;
            document.getElementById('modalBody').innerHTML = modalData[type].body;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
