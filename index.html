<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070709;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(168, 85, 247, 0.18), transparent 45%),
                radial-gradient(circle at 85% 40%, rgba(56, 239, 125, 0.06), transparent 40%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Modern Üst Marka Alanı */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .img-bxasaran {
            height: 22px;
            width: auto;
            object-fit: contain;
        }

        .img-logo {
            height: 46px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(56, 239, 125, 0.3));
        }

        .img-store {
            height: 22px;
            width: auto;
            object-fit: contain;
        }

        /* Modern Glassmorphism Menü Çubuğu */
        .modern-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(24, 24, 30, 0.75);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(200, 130, 214, 0.25);
            backdrop-filter: blur(12px);
        }

        .nav-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 13px;
            padding: 10px 6px;
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
            font-size: 0.74rem;
            font-weight: 600;
            line-height: 1.25;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-align: center;
