<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070709;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(168, 85, 247, 0.18), transparent 45%),
                radial-gradient(circle at 85% 40%, rgba(56, 239, 125, 0.06), transparent 40%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Modern Üst Marka Alanı */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #a1a1aa;
            letter-spacing: 0.5px;
        }

        .mini-emblem {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 10px rgba(56, 239, 125, 0.4));
        }

        /* Modern Glassmorphism Menü Çubuğu */
        .modern-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(24, 24, 30, 0.75);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(200, 130, 214, 0.25);
            backdrop-filter: blur(12px);
        }

        .nav-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 13px;
            padding: 10px 6px;
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
            font-size: 0.74rem;
            font-weight: 600;
            line-height: 1.25;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .nav-pill svg {
            width: 16px;
            height: 16px;
            stroke: #c882d6;
        }

        .nav-pill:hover, .nav-pill:active {
            background: rgba(200, 130, 214, 0.16);
            border-color: rgba(200, 130, 214, 0.5);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Durum / Güven Rozeti Şeridi */
        .trust-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(200, 130, 214, 0.12), rgba(24, 24, 30, 0.6));
            border: 1px solid rgba(200, 130, 214, 0.22);
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 0.78rem;
            color: #d4d4d8;
        }

        .trust-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #e5a9f2;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Bölüm Başlığı */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: -10px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
        }

        .app-count {
            font-size: 0.75rem;
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* Modern Uygulama Kartları Listesi */
        .apps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .modern-app-card:hover {
            background: rgba(30, 30, 38, 0.95);
            border-color: rgba(200, 130, 214, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-spotify {
            background-color: #121212;
            border: 1px solid #282828;
        }

        .icon-instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        .icon-youtube {
            background-color: #FF0000;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-name {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .app-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        .tag-free {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.68rem;
        }

        .download-pill {
            background: linear-gradient(135deg, #9c4dcc, #c882d6);
            color: #09090b;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 9px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(200, 130, 214, 0.3);
        }

        /* Beğendiğiniz Açılır Pencere (Modal) Tasarımı */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #111115;
            border: 1px solid #c882d6;
            box-shadow: 0 0 25px rgba(200, 130, 214, 0.35);
            border-radius: 18px;
            max-width: 460px;
            width: 100%;
            padding: 24px;
            color: #e4e4e7;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e5a9f2;
            margin-bottom: 12px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 10px;
        }

        .modal-content {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #d4d4d8;
        }

        .modal-content strong {
            color: #ffffff;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #9c4dcc, #c882d6);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Üst Marka Başlığı -->
        <header>
            <span class="brand-logo-text">Bxasaran</span>
            <div class="mini-emblem">
                <svg viewBox="0 0 100 100" width="30" height="30">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38ef7d" />
                            <stop offset="50%" stop-color="#11998e" />
                            <stop offset="100%" stop-color="#0575E6" />
                        </linearGradient>
                    </defs>
                    <polygon points="50,10 92,85 8,85" fill="#1e2229" />
                    <polygon points="50,10 88,80 74,80 50,34 26,80 70,80 65,70 40,70 50,50" fill="url(#logoGrad)" />
                </svg>
            </div>
            <span class="brand-logo-text">store</span>
        </header>

        <!-- Modern Glassmorphism Navigasyon Menüsü -->
        <nav class="modern-nav">
            <button class="nav-pill" onclick="openModal('guvenlik')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Güvenliğiniz<br>İçin</span>
            </button>
            <button class="nav-pill" onclick="openModal('hakkimizda')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>Hakkımızda</span>
            </button>
            <button class="nav-pill" onclick="openModal('gelir')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg>
                <span>Gelir Modelimiz<br>Hakkında</span>
            </button>
        </nav>

        <!-- Resmi Kaynak Bilgilendirme Şeridi -->
        <div class="trust-banner">
            <div class="trust-badge">
                <span class="dot"></span>
                Resmi Dağıtım Kanalı
            </div>
            <span>%100 Ücretsiz & Bağışsız</span>
        </div>

        <!-- Uygulamalar Başlığı -->
        <div class="section-header">
            <h2 class="section-title">Uygulamalar</h2>
            <span class="app-count">3 Uygulama</span>
        </div>

        <!-- Modern Uygulama Kartları -->
        <main class="apps-list">
            <!-- Spotify -->
            <a href="#spotify-indir" class="modern-app-card">
                <div class="app-left">
                    <div class="app-icon icon-spotify">
                        <svg viewBox="0 0 24 24" width="34" height="34" fill="#1ED760">
                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                        </svg>
                    </div>
                    <div class="app-info">
                        <span class="app-name">Spotify</span>
                        <div class="app-meta">
                            <span class="tag-free">Ücretsiz</span>
                            <span>• Resmi APK</span>
                        </div>
                    </div>
                </div>
                <div class="download-pill">İndir</div>
            </a>

            <!-- Instagram -->
            <a href="#instagram-indir" class="modern-app-card">
                <div class="app-left">
                    <div class="app-icon icon-instagram">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </div>
                    <div class="app-info">
                        <span class="app-name">Instagram</span>
                        <div class="app-meta">
                            <span class="tag-free">Ücretsiz</span>
                            <span>• Resmi APK</span>
                        </div>
                    </div>
                </div>
                <div class="download-pill">İndir</div>
            </a>

            <!-- YouTube -->
            <a href="#youtube-indir" class="modern-app-card">
                <div class="app-left">
                    <div class="app-icon icon-youtube">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff">
                            <polygon points="8,5 19,12 8,19" />
                        </svg>
                    </div>
                    <div class="app-info">
                        <span class="app-name">YouTube</span>
                        <div class="app-meta">
                            <span class="tag-free">Ücretsiz</span>
                            <span>• Resmi APK</span>
                        </div>
                    </div>
                </div>
                <div class="download-pill">İndir</div>
            </a>
        </main>
    </div>

    <!-- Beğendiğiniz Bilgi Penceresi (Modal) -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Başlık</h3>
            <div class="modal-content" id="modalBody">İçerik</div>
            <button class="close-btn" onclick="closeModal()">Anladım, Kapat</button>
        </div>
    </div>

    <script>
        const modalData = {
            guvenlik: {
                title: "Güvenliğiniz İçin Yalnızca Sitemizden İndirin!",
                body: `Uygulamalarımızın güvenliği, bütünlüğü ve güncelliği yalnızca resmi web sitemiz <strong>Bxasaran Store</strong> tarafından garanti edilmektedir.<br><br>
                Web sitemiz dışında (üçüncü taraf APK siteleri, forumlar, Telegram kanalları veya dosya paylaşım platformları aracılığıyla) yayımlanan hiçbir dosya <strong>tarafımıza ait değildir</strong>. Cihazınızın güvenliği için uygulamalarımızı <strong>asla başka bir kaynaktan indirmeyiniz</strong>.`
            },
            hakkimizda: {
                title: "Hakkımızda & Ücretsiz Kullanım Politikası",
                body: `<strong>Bxasaran Store</strong> olarak geliştirdiğimiz ve düzenlediğimiz tüm uygulamalar tamamen <strong>ücretsizdir</strong>.<br><br>
                Kullanıcılarımızdan hiçbir şekilde <strong>para, bağış, abonelik ücreti veya maddi destek</strong> talep edilmemektedir. Adımıza veya uygulamalarımız üzerinden sizden para isteyen hiçbir kişi, kurum veya siteye itibar etmeyiniz.`
            },
            gelir: {
                title: "Gelir Modelimiz Hakkında",
                body: `Uygulamalarımızın geliştirme, bakım ve sunucu maliyetlerini karşılayabilmek adına tek gelir kaynağımız <strong>uygulama içi reklamlardır</strong>.<br><br>
                Sizlerden herhangi bir ödeme veya bağış talep edilmez; yalnızca projelerimizi sürdürebilmemizi sağlayan standart reklam gösterimleri mevcuttur.`
            }
        };

        function openModal(type) {
            document.getElementById('modalTitle').innerHTML = modalData[type].title;
            document.getElementById('modalBody').innerHTML = modalData[type].body;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
