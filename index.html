<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bxasaran Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
            overflow-x: hidden;
        }

        /* Üst Header: Bxasaran [Logo] store */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 32px;
            width: 100%;
            max-width: 500px;
        }

        .img-bxasaran {
            height: 24px;
            width: auto;
            object-fit: contain;
        }

        .img-logo {
            height: 54px;
            width: auto;
            object-fit: contain;
        }

        .img-store {
            height: 24px;
            width: auto;
            object-fit: contain;
        }

        /* 3'lü Görsel Buton Grubu */
        .nav-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 65px;
        }

        .img-btn {
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .img-btn img {
            width: 100%;
            max-width: 150px;
            height: auto;
            display: block;
            border-radius: 50px;
        }

        .img-btn:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.12);
        }

        .img-btn:active {
            transform: scale(0.96);
        }

        /* Uygulama İkonları Alanı */
        .apps-grid {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 28px;
            width: 100%;
            max-width: 440px;
            padding-left: 10px;
        }

        .app-card {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .app-card:hover {
            transform: scale(1.08);
        }

        .app-spotify {
            background-color: #121212;
            border: 1px solid #242424;
        }

        .app-instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        .app-youtube {
            background-color: #FF0000;
            border-radius: 20px;
        }

        /* Açılır Bilgi Penceresi (Modal) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #111115;
            border: 1px solid #c882d6;
            box-shadow: 0 0 25px rgba(200, 130, 214, 0.35);
            border-radius: 18px;
            max-width: 460px;
            width: 100%;
            padding: 24px;
            color: #e4e4e7;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e5a9f2;
            margin-bottom: 12px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 10px;
        }

        .modal-content {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #d4d4d8;
        }

        .modal-content strong {
            color: #ffffff;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #9c4dcc, #c882d6);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 400px) {
            header { gap: 14px; }
            .img-bxasaran, .img-store { height: 20px; }
            .img-logo { height: 46px; }
            .apps-grid { gap: 20px; justify-content: center; padding-left: 0; }
            .app-card { width: 68px; height: 68px; }
        }
    </style>
</head>
<body>

    <!-- Üst Logo ve Marka Görselleri -->
    <header>
        <img src="bxasaran.png" alt="Bxasaran" class="img-bxasaran">
        <img src="logo.png" alt="Bxasaran Logo" class="img-logo">
        <img src="store.png" alt="store" class="img-store">
    </header>

    <!-- 3 Kapsül Bilgi Butonu (Görsel) -->
    <nav class="nav-buttons">
        <button class="img-btn" onclick="openModal('guvenlik')">
            <img src="btn-guvenlik.png" alt="Güvenliğiniz İçin">
        </button>
        <button class="img-btn" onclick="openModal('hakkimizda')">
            <img src="btn-hakkimizda.png" alt="Hakkımızda">
        </button>
        <button class="img-btn" onclick="openModal('gelir')">
            <img src="btn-gelir.png" alt="Gelir Modelimiz Hakkında">
        </button>
    </nav>

    <!-- Uygulama İkonları -->
    <main class="apps-grid">
        <!-- Spotify -->
        <a href="#spotify-indir" class="app-card app-spotify" title="Spotify İndir">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="#1ED760">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
        </a>

        <!-- Instagram -->
        <a href="#instagram-indir" class="app-card app-instagram" title="Instagram İndir">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>

        <!-- YouTube -->
        <a href="#youtube-indir" class="app-card app-youtube" title="YouTube İndir">
            <svg viewBox="0 0 24 24" width="38" height="38" fill="#ffffff">
                <polygon points="8,5 19,12 8,19" />
            </svg>
        </a>
    </main>

    <!-- Bilgi Penceresi (Modal) -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Başlık</h3>
            <div class="modal-content" id="modalBody">İçerik</div>
            <button class="close-btn" onclick="closeModal()">Anladım, Kapat</button>
        </div>
    </div>

    <script>
        const modalData = {
            guvenlik: {
                title: "Güvenliğiniz İçin Yalnızca Sitemizden İndirin!",
                body: `Uygulamalarımızın güvenliği, bütünlüğü ve güncelliği yalnızca resmi web sitemiz <strong>Bxasaran Store</strong> tarafından garanti edilmektedir.<br><br>
                Web sitemiz dışında (üçüncü taraf APK siteleri, forumlar, Telegram kanalları veya dosya paylaşım platformları aracılığıyla) yayımlanan hiçbir dosya <strong>tarafımıza ait değildir</strong>. Cihazınızın güvenliği için uygulamalarımızı <strong>asla başka bir kaynaktan indirmeyiniz</strong>.`
            },
            hakkimizda: {
                title: "Hakkımızda & Ücretsiz Kullanım Politikası",
                body: `<strong>Bxasaran Store</strong> olarak geliştirdiğimiz ve düzenlediğimiz tüm uygulamalar tamamen <strong>ücretsizdir</strong>.<br><br>
                Kullanıcılarımızdan hiçbir şekilde <strong>para, bağış, abonelik ücreti veya maddi destek</strong> talep edilmemektedir. Adımıza veya uygulamalarımız üzerinden sizden para isteyen hiçbir kişi, kurum veya siteye itibar etmeyiniz.`
            },
            gelir: {
                title: "Gelir Modelimiz Hakkında",
                body: `Uygulamalarımızın geliştirme, bakım ve sunucu maliyetlerini karşılayabilmek adına tek gelir kaynağımız <strong>uygulama içi reklamlardır</strong>.<br><br>
                Sizlerden herhangi bir ödeme veya bağış talep edilmez; yalnızca projelerimizi sürdürebilmemizi sağlayan standart reklam gösterimleri mevcuttur.`
            }
        };

        function openModal(type) {
            document.getElementById('modalTitle').innerHTML = modalData[type].title;
            document.getElementById('modalBody').innerHTML = modalData[type].body;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
